<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,440;9..144,560;9..144,650&family=IBM+Plex+Mono:wght@500;600&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root{
    --stone:#e9e3d6;
    --paper:#faf7f0;
    --ink:#2a231d;
    --ink-soft:#5b5147;
    --pompeian:#a5402c;
    --pompeian-deep:#7c2f21;
    --bronze:#8c7a4f;
    --pine:#4a5a44;
    --line:#d8cfba;
    --radius:14px;
  }

  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html{-webkit-text-size-adjust:100%;}

  body{
    margin:0;
    background:var(--stone);
    color:var(--ink);
    font-family:'Source Sans 3', system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-bottom:3rem;
  }

  a{color:inherit;}

  /* ---------- Header ---------- */
  header{
    padding:2.2rem 1.25rem 1.6rem;
    text-align:center;
    background:

      var(--stone);
    border-bottom:1px solid var(--line);
  }
  .eyebrow{
    font-family:'IBM Plex Mono', monospace;
    font-size:0.68rem;
    letter-spacing:0.18em;
    text-transform:uppercase;
    color:var(--pompeian-deep);
    margin:0 0 0.6rem;
  }
  h1{
    font-family:'Fraunces', serif;
    font-weight:650;
    font-size:clamp(2.2rem, 9vw, 2.8rem);
    letter-spacing:0.01em;
    margin:0 0 0.35rem;
  }
  header p.sub{
    margin:0;
    color:var(--ink-soft);
    font-size:0.92rem;
  }

  /* ---------- Day tabs (targa / street-plaque style) ---------- */
  nav.day-tabs{
    position:sticky;
    top:0;
    z-index:20;
    display:flex;
    gap:0.5rem;
    overflow-x:auto;
    padding:0.85rem 1rem;
    background:var(--stone);
    border-bottom:1px solid var(--line);
    scrollbar-width:none;
  }
  nav.day-tabs::-webkit-scrollbar{display:none;}

  .tab{
    flex:0 0 auto;
    font-family:'IBM Plex Mono', monospace;
    font-size:0.72rem;
    letter-spacing:0.06em;
    text-transform:uppercase;
    padding:0.55rem 0.8rem 0.5rem;
    background:var(--paper);
    color:var(--ink-soft);
    border:1px solid var(--line);
    border-radius:10px 10px 5px 5px;
    cursor:pointer;
    text-align:center;
    line-height:1.25;
    min-width:64px;
    transition:transform .15s ease;
  }
  .tab .d{display:block; font-size:0.78rem; font-weight:600; color:var(--ink);}
  .tab.active{
    background:var(--pompeian);
    border-color:var(--pompeian-deep);
    color:var(--paper);
    box-shadow:inset 0 2px 5px rgba(0,0,0,0.35);
    transform:translateY(1px);
  }
  .tab.active .d{color:var(--paper);}
  .tab:focus-visible{outline:2px solid var(--pine); outline-offset:2px;}

  /* ---------- Day content ---------- */
  main{
    max-width:640px;
    margin:0 auto;
    padding:1.4rem 1.1rem 0.5rem;
  }

  .day-theme{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:0.75rem;
    margin:0 0 1.1rem;
    padding-bottom:0.7rem;
    border-bottom:2px solid var(--ink);
  }
  .day-theme h2{
    font-family:'Fraunces', serif;
    font-weight:650;
    font-size:1.5rem;
    margin:0;
  }
  .day-theme span{
    font-family:'IBM Plex Mono', monospace;
    font-size:0.7rem;
    letter-spacing:0.05em;
    color:var(--bronze);
    white-space:nowrap;
  }

  #dayMap{
    height:230px;
    border-radius:var(--radius);
    margin-bottom:1.4rem;
    border:1px solid var(--line);
    overflow:hidden;
    background:var(--paper);
  }
  .map-pin{
    display:flex;
    align-items:center;
    justify-content:center;
    width:26px;
    height:26px;
    border-radius:50%;
    background:var(--pompeian);
    color:var(--paper);
    border:2px solid var(--paper);
    box-shadow:0 0 0 1.5px var(--pompeian-deep);
    font-family:'IBM Plex Mono', monospace;
    font-size:0.72rem;
    font-weight:600;
    position:relative;
    z-index:2;
  }
  .rail > .map-pin{
    margin-top:4px;
    flex:0 0 auto;
  }
  .leaflet-popup-content-wrapper{
    background:var(--paper);
    color:var(--ink);
    border-radius:10px;

  .leaflet-popup-tip{background:var(--paper);}
  .leaflet-control-attribution{font-size:0.6rem;}

  /* ---------- Timeline ---------- */
  .stop{
    display:grid;
    grid-template-columns:64px 1fr;
    column-gap:0.85rem;
    position:relative;
  }
  .stop .rail{
    position:relative;
    display:flex;
    flex-direction:column;
    align-items:center;
  }
  .stop .rail::before{
    content:'';
    position:absolute;
    top:30px;
    bottom:-1.55rem;
    width:0;
    border-left:2px dotted var(--line);

  .stop:last-child .rail::before{display:none;}

    font-size:0.66rem;
    letter-spacing:0.03em;
    color:var(--ink-soft);

    text-align:center;
    line-height:1.2;

  }

  }
</style>
</head>

const IS_IOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
const IS_ANDROID = /Android/i.test(navigator.userAgent);

function webMapsUrl(q){
  return 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(q);
}

// Builds the href + any extra attributes for the "Open in Maps" link,
// preferring a direct hand-off to the native Google Maps app.
function mapLinkAttrs(q){
  const query = encodeURIComponent(q);
  const web = webMapsUrl(q);

  if(IS_IOS){
    // comgooglemaps:// is Google Maps' own iOS URL scheme — opens the app directly.
    // If the app isn't installed, nothing happens on tap, so fall back to the
    // web version after a short delay if the page never lost focus.
    return `href="comgooglemaps://?q=${query}" onclick="setTimeout(function(){ if(!document.hidden){ window.location.href='${web}'; } }, 1200);"`;
  }
  if(IS_ANDROID){
    // geo: is the standard Android intent for map queries — the OS routes it
    // to Google Maps (or whichever maps app is set as default) directly.
    return `href="geo:0,0?q=${query}"`;
  }
  // Desktop / anything else: no native app to hand off to, use the web version.
  return `href="${web}" target="_blank" rel="noopener"`;
}

// ---------- Walking time between two consecutive stops ----------
function haversineKm(lat1, lon1, lat2, lon2){
  const R = 6371;
  const toRad = deg => deg * Math.PI / 180;
  const dLat = toRad(lat2 - lat1);
  const dLon = toRad(lon2 - lon1);
  const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

function walkNote(a, b){
  if(a.lat == null || a.lng == null || b.lat == null || b.lng == null) return '';
  const km = haversineKm(a.lat, a.lng, b.lat, b.lng);
  if(km > 3) return ''; // not a realistic walk (e.g. an airport transfer) — skip the badge
  if(km < 0.15) return 'Just around the corner';
  const routedKm = km * 1.3; // rough allowance for actual street routing vs a straight line
  const minutes = Math.max(1, Math.round(routedKm / 4.8 * 60)); // ~4.8 km/h walking pace
  return `≈${minutes} min walk`;
}

      <p>Via Giacinto Carini 71, Monteverde — a block from the Gianicolo, an easy walk down into Trastevere.</p>
      <a class="maplink" ${mapLinkAttrs('Via Giacinto Carini 71, Rome')}>${PIN} Open in Maps</a>
    </div>

    <div class="info-block">
      <h3>Nearest pharmacy</h3>
      <p>Farmacia Carini del Dr. Brienza, Via Giacinto Carini 44 — same street as the apartment. Mon–Fri 8:30am–1pm &amp; 4–7:30pm, Sat 8:30am–1pm, closed Sunday. +39 06 581 2381.</p>
      <a class="maplink" ${mapLinkAttrs('Farmacia Carini del Dr. Brienza, Rome')}>${PIN} Open in Maps</a>
    </div>

    <div class="info-block">
      <h3>Emergency numbers</h3>
      <p><strong>112</strong> — the general emergency number, works anywhere in Italy and the EU, covers police, ambulance and fire.</p>
    </div>

    <div class="info-block">
      <h3>Getting a taxi</h3>
      <p>FreeNow and itTaxi are the two apps that actually work well in Rome — both call a real licensed taxi with upfront pricing. Regular Uber doesn't really exist here; the Uber app mostly just offers Uber Black, a pricier private-hire option.</p>
    </div>

    <div class="info-block">
      <h3>WiFi</h3>
      <p>Add the network name and password here once you've checked in.</p>
    </div>
  `;
}

function renderTabs(){
  tabsEl.innerHTML = navItems.map((item,i)=>
    `<button class="tab${i===active?' active':''}" data-i="${i}">${item.label}<span class="d">${item.sub}</span></button>`
  ).join('');
  tabsEl.querySelectorAll('.tab').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      active = parseInt(btn.dataset.i, 10);
      renderTabs();
      renderActive();
      window.scrollTo({top:0, behavior:'smooth'});
    });
  });
}

function renderMap(stops){
  const mapEl = document.getElementById('dayMap');
  if(!mapEl || typeof L === 'undefined') return;

  if(currentMap){ currentMap.remove(); currentMap = null; }

  const map = L.map(mapEl, { attributionControl:false, scrollWheelZoom:false });
  L.tileLayer('https://basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}.png?key=cb1_2l5h_1_b746774a89ece40515aee909', {
    maxZoom:19
  }).addTo(map);
  L.control.attribution({ position:'bottomright' }).addAttribution('&copy; OpenStreetMap &copy; CARTO').addTo(map);

  const latlngs = [];
  stops.forEach((s, i) => {
    if(s.lat == null || s.lng == null) return;
    const ll = [s.lat, s.lng];
    latlngs.push(ll);
    const icon = L.divIcon({
      className:'',
      html:`<div class="map-pin">${i+1}</div>`,
      iconSize:[26,26],
      iconAnchor:[13,13],
      popupAnchor:[0,-14]
    });
    L.marker(ll, { icon }).addTo(map)
      .bindPopup(`<strong>${s.title}</strong><br>${s.time}`);
  });

  if(latlngs.length > 1){
    L.polyline(latlngs, { color:'#4a5a44', weight:2.5, dashArray:'6,8', opacity:0.85 }).addTo(map);
  }
  if(latlngs.length){
    map.fitBounds(latlngs, { padding:[30,30], maxZoom:16 });
  } else {
    map.setView([41.9, 12.48], 13);
  }
  currentMap = map;
}

function renderDayView(d){
  const stopsHtml = d.stops.map((s, i) => {
    const next = d.stops[i+1];
    const walk = next ? walkNote(s, next) : '';
    return `
    <div class="stop">
      <div class="rail">
        <div class="map-pin">${i+1}</div>
        <time>${s.time.replace(' ', '<br>')}</time>
        ${walk ? `<span class="walk">${walk}</span>` : ''}
      </div>
      <div class="card">
        <h3>${s.title}</h3>
        <p>${s.blurb}</p>
        <a class="maplink" ${mapLinkAttrs(s.map)}>${PIN} Open in Maps</a>
      </div>
    </div>
  `;
  }).join('');

  contentEl.innerHTML = `
    <div class="day-theme">
      <h2>${d.theme}</h2>
      <span>${d.day} · ${d.date}</span>
    </div>
    <div id="dayMap"></div>
    ${stopsHtml}
  `;

  renderMap(d.stops);
}

function renderActive(){
  const item = navItems[active];

  if(item.type === 'day'){
    renderDayView(itinerary[item.dayIndex]);
    return;
  }

  if(currentMap){ currentMap.remove(); currentMap = null; }

  if(item.type === 'info'){
    renderInfo();
  }
}

renderTabs();
renderActive();
</script>

</body>
</html>
